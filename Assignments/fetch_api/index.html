<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Demo</title>
</head>
<body>

<h2>User List</h2>

<button onclick="getUsers()">Load Users</button>
<button onclick="showEmails()">Show Emails</button>

<div id="users"></div>

<script>
function getUsers() {

    fetch('https://jsonplaceholder.typicode.com/users')

    .then(response => response.json())

    .then(data => {

        console.log(data); // for debugging

        let output = "";

        data.forEach(user => {
            output += `
                <p>
                    <b>${user.name}</b><br>
                    <!-- ${user.email} -->
                </p>
            `;
        });

        document.getElementById("users").innerHTML = output;
    })

    .catch(error => {
        console.log("Error:", error);
    });
}

function showEmails() {

    fetch('https://jsonplaceholder.typicode.com/users')

    .then(response => response.json())

    .then(data => {

        console.log(data); // for debugging

        let output = "";

        data.forEach(user => {
            output += `
                <p>
                    <b>${user.name}'s email: ${user.email}</b><br>
                </p>
            `;
        });

        document.getElementById("users").innerHTML = output;
    })

    .catch(error => {
        console.log("Error:", error);
    });
}

</script>

</body>
</html>
