<!DOCTYPE html>
<html>
<head>
    <title>Simple Fetch Demo</title>
</head>
<body>

<h2>Post Titles</h2>

<button onclick="loadPosts()">Load Posts</button>
<button onclick="nextPosts()">Next 5 Posts</button>

<ul id="posts"></ul>

let currentIndex = 5;


<script>

function loadPosts() {

    fetch('https://jsonplaceholder.typicode.com/posts')

    .then(response => response.json())

    .then(data => {

        console.log(data);

        let output = "";

        data.slice(0,5).forEach(post => {
            output += `<li>${post.title}</li>`;
        });

        document.getElementById("posts").innerHTML = output;

        currentIndex = 5;
    })

    .catch(error => {
        console.log("Error:", error);
    });
}

function nextPosts() {
    fetch('https://jsonplaceholder.typicode.com/posts')
    .then(response => response.json())
    .then(data => {
        console.log(data);
        let output = "";
       let nextFivePosts = data.slice(currentIndex, currentIndex + 5);
       nextFivePosts.forEach(post => {
           output += `<li>${post.title}</li>`;
       });

        document.getElementById("posts").innerHTML = output;
        currentIndex += 5;
    })
    .catch(error => {
        console.log("Error:", error);
    });
}

</script>

</body>
</html>
